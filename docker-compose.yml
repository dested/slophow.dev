# One-box deploy: app + Postgres + persistent volumes.
#   docker compose up -d --build
# Set BETTER_AUTH_SECRET (and optionally GITHUB_* / ADMIN_EMAILS) in a .env
# file next to this compose file or in the environment.
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://slopshow:slopshow@db:5432/slopshow
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://slopshow.dev}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATA_DIR: /data
    command: sh -c "bunx prisma db push --skip-generate && bun server.ts"
    volumes:
      - uploads:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slopshow
      POSTGRES_PASSWORD: slopshow
      POSTGRES_DB: slopshow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slopshow']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
